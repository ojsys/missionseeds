<!doctype html><html><head><meta charset="utf-8"><title>device test</title>
<style>
 body{margin:0;background:#333;font:12px system-ui;color:#eee}
 #bar{padding:6px 10px;background:#111}
 #frame{border:0;display:block;background:#fff}
</style></head><body>
<div id="bar"><span id="label"></span></div>
<iframe id="frame" src="about:blank"></iframe>
<script>
 const q = new URLSearchParams(location.search);
 const w = +(q.get('w')||390), h = +(q.get('h')||520), p = q.get('p')||'/';
 const f = document.getElementById('frame');
 f.width = w; f.height = h; f.src = p;
 document.getElementById('label').textContent = w+'px viewport — '+p;
 window.setY = y => { f.contentWindow.scrollTo(0,y); return f.contentWindow.innerWidth; };
 window.probe = () => {
   const d=f.contentDocument, w2=f.contentWindow;
   const nav=d.getElementById('site-nav'), tog=d.getElementById('nav-toggle');
   return JSON.stringify({
     viewport:w2.innerWidth,
     docScrollW:d.documentElement.scrollWidth,
     bodyScrollW:d.body.scrollWidth,
     horizontalOverflow: d.documentElement.scrollWidth > w2.innerWidth+1,
     navDisplay:getComputedStyle(nav).display,
     togglerDisplay:getComputedStyle(tog).display,
     widestEl: [...d.querySelectorAll('body *')]
       .map(e=>({t:e.tagName+'.'+(e.className&&e.className.toString?e.className.toString().slice(0,26):''), r:Math.round(e.getBoundingClientRect().right)}))
       .filter(x=>x.r > w2.innerWidth+1).slice(0,6)
   });
 };
</script></body></html>
